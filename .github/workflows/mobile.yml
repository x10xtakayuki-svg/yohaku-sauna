name: Check mobile background audio
on:
  push:
    paths: ['mobile/**', 'public/**', 'tests/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          node --check public/app.js
          node tests/simulation.cjs
          node tests/native-bridge.cjs
          cmake -S mobile/core -B build/core -DCMAKE_BUILD_TYPE=Release
          cmake --build build/core --parallel 2
          build/core/core_tests build/yohaku-native-preview.wav
      - uses: actions/upload-artifact@v4
        with:
          name: native-audio-preview
          path: build/yohaku-native-preview.wav
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: |
          node mobile/scripts/bundle.mjs
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          gradle -p mobile/android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Android-debug-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          node mobile/scripts/bundle.mjs
          xcodebuild -project mobile/ios/Yohaku.xcodeproj -scheme Yohaku -sdk iphonesimulator -configuration Debug -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent build/ios/Build/Products/Debug-iphonesimulator/Yohaku.app build/Yohaku-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: iOS-simulator-not-installable-on-iPhone
          path: build/Yohaku-iOS-Simulator.zip
          retention-days: 14
